name: my_game
description: My new Flame game
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  bloc: ^8.1.2
  equatable: ^2.0.5
  flame: ^1.38.0
  flame_audio: ^2.12.2
  flame_behaviors: ^1.0.0
  flame_tiled: ^3.1.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.2.0+1
  flutter_bloc: ^8.1.3
  flutter_localizations:
    sdk: flutter
  google_fonts: ^5.1.0
  intl: ^0.20.3
  mockingjay: ^0.4.0

dev_dependencies:
  bloc_test: ^9.1.4
  build_runner: ^2.8.0
  flame_test: ^1.12.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/background.gif
    - assets/tiles/my_tile.tmx
    - assets/audio/
    - assets/licenses/poppins/


flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true
    flare_flutter: true

  assets:
    enabled: true

    outputs:
      class_name: MyAssets
      package_parameter_enabled: false
      # Assets.imagesChip
      # style: camel-case
      # Assets.images_chip
      # style: snake-case
      # Assets.images.chip (default style)
      style: dot-delimiter

    exclude:
      - assets/images/chip3/chip3.jpg
      - pictures/chip5.jpg
      - assets/flare/
